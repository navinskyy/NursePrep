<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/favicon.png">
<title>Quiz | NursePrep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/quiz.css">
</head>
<body class="dash-body">

<a class="skip-link" href="#main-content">Skip to main content</a>
  <div class="alarm-bg" aria-hidden="true"></div>
  <div class="corner-flash corner-tl" aria-hidden="true"></div>
  <div class="corner-flash corner-tr" aria-hidden="true"></div>
  <div class="corner-flash corner-bl" aria-hidden="true"></div>
  <div class="corner-flash corner-br" aria-hidden="true"></div>

  <!-- Sidebar injected by js/sidebar.js -->

<main id="main-content" class="dash-main dash-main-center">
  <div class="quiz-shell" id="quizShell">
    <div class="quiz-urgency-vignette" id="quizUrgencyVignette" aria-hidden="true"></div>

    <div class="quiz-progress-row">
    <div class="subject-picker">

    <span class="eyebrow">
        Subject
    </span>

<h2 id="subjectTitle">
         Foundation of Nursing
     </h2>

</div>
      <div class="quiz-meta">
        <div class="quiz-timer-widget" id="quizTimerWidget" data-state="idle" aria-live="off" aria-atomic="true">
          <div class="quiz-timer-ring-wrap">
            <svg class="quiz-timer-ring" viewBox="0 0 44 44" aria-hidden="true">
              <circle class="quiz-timer-ring-bg" cx="22" cy="22" r="19"/>
              <circle class="quiz-timer-ring-fill" id="quizTimerRing" cx="22" cy="22" r="19"/>
            </svg>
            <span class="quiz-timer" id="quizTimer" aria-hidden="true">--:--</span>
          </div>
          <span class="quiz-timer-label" id="quizTimerLabel" data-state="calm">Loading</span>
        </div>
        <span class="quiz-count" id="quizCount">01 / 05</span>
      </div>
    </div>
    <div class="quiz-progress-track"><span id="quizProgressFill" style="width:0%"></span></div>

    <div class="question-card" role="form" aria-labelledby="quizQuestion">
      <h3 id="quizQuestion">Loading question…</h3>

      <div class="choices" id="quizChoices" role="radiogroup" aria-labelledby="quizQuestion"></div>

      <div class="quiz-feedback" id="quizFeedback" role="status" aria-live="polite" aria-atomic="true">
        <span class="quiz-feedback-icon" id="quizFeedbackIcon" aria-hidden="true"></span>
        <span class="quiz-feedback-text" id="quizFeedbackText"></span>
      </div>

      <div class="quiz-explanation" id="quizExplanation" role="region" aria-live="polite" aria-label="Answer explanation">
        <span class="quiz-explanation-eyebrow">Explanation</span>
        <p id="quizExplanationText"></p>
      </div>

      <p class="quiz-warning" id="quizWarning" role="alert">Please select an answer first.</p>
    </div>

    <div class="quiz-footer">
      <button class="btn btn-secondary" id="quizPrev" disabled>Previous</button>
      <button class="btn btn-secondary" id="quizNext" disabled>Next</button>
    </div>

  </div>
</main>



<script type="module" src="./js/quiz.js"></script>
<script type="module" src="js/sidebar.js"></script>
</body>
</html>
