<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/favicon.png">
<title>Practice Mistakes | NursePrep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/review.css">
</head>
<body class="dash-body">

<!-- Sidebar injected by js/sidebar.js -->

<main class="dash-main dash-main-center">
  <div class="review-shell" id="reviewShell">

    <div class="review-header">
      <div class="subject-picker">
        <span class="eyebrow">Subject</span>
        <select id="subjectSelect">
          <option value="all">All Subjects</option>
        </select>
      </div>
      <span class="review-count" id="reviewCount">0 mistakes</span>
    </div>

    <div class="review-progress-track">
      <span id="reviewProgressFill" style="width:0%"></span>
    </div>

    <div id="reviewContent">
      <div class="review-empty">
        <div class="review-empty-icon">&#10003;</div>
        <h2>No mistakes yet</h2>
        <p>Complete a quiz and any wrong answers will appear here for review.</p>
        <a href="subjects.html" class="btn btn-primary">Take a Quiz</a>
      </div>
    </div>

  </div>
</main>



<script type="module" src="./js/review.js"></script>
<script type="module" src="js/sidebar.js"></script>
</body>
</html>
