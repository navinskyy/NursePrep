<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/favicon.png">
<title>Leaderboard | NursePrep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/leaderboard.css">
</head>
<body class="dash-body">

<!-- Sidebar injected by js/sidebar.js -->

<main class="dash-main leaderboard-shell">

  <div class="shell-eyebrow">Community · Rankings</div>

  <div class="leaderboard-header">
    <h1>Leaderboard</h1>
    <div class="leaderboard-tabs">
      <button class="tab active" data-tab="alltime">All-Time</button>
      <button class="tab" data-tab="weekly">This Week</button>
    </div>
  </div>

  <div class="leaderboard-table-wrap">
    <div class="leaderboard-header-row">
      <span class="col-rank">Rank</span>
      <span class="col-user">User</span>
      <span class="col-level">Level</span>
      <span class="col-xp">XP</span>
      <span class="col-streak">Streak</span>
      <span class="col-score">Rank Score</span>
      <span class="col-badges">Badges</span>
    </div>
    <div id="leaderboardList" class="leaderboard-list">
      <div class="leaderboard-empty">Loading rankings…</div>
    </div>
  </div>

  <div class="leaderboard-legend">
    <p><strong>Ranking Score</strong> = XP + (Streak × 20) + (Average Score × 5)</p>
    <p class="text-low">Rewards consistent learning, not just high scores.</p>
  </div>

</main>



<script type="module" src="./js/leaderboard.js"></script>
<script type="module" src="js/sidebar.js"></script>
</body>
</html>
